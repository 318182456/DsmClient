name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Android uses the checked-in AAR files; the LFS framework is iOS-only.
      - name: Set up Java for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11479570'
          packages: 'platform-tools'

      - name: Restore Android platform and build tools
        id: android-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-33
            ${{ env.ANDROID_HOME }}/build-tools/29.0.2
            ${{ env.ANDROID_HOME }}/build-tools/30.0.3
          key: android-${{ runner.os }}-api33-build-tools29.0.2-30.0.3-v1

      - name: Install missing Android packages
        if: steps.android-cache.outputs.cache-hit != 'true'
        run: sdkmanager "platforms;android-33" "build-tools;29.0.2" "build-tools;30.0.3"

      # Save the SDK before project compilation, including when compilation fails.
      - name: Save Android packages
        if: steps.android-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-33
            ${{ env.ANDROID_HOME }}/build-tools/29.0.2
            ${{ env.ANDROID_HOME }}/build-tools/30.0.3
          key: ${{ steps.android-cache.outputs.cache-primary-key }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.7.12'
          cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Resolve dependencies
        run: flutter pub get

      - name: Test DSM protocol compatibility
        run: dart --no-sound-null-safety test/dsm_compatibility_test.dart

      # The inherited Gradle file requires key.properties for debug builds too.
      # Generate a disposable test key instead of using a production secret.
      - name: Prepare CI test signing
        shell: bash
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/dsmclient-ci.jks" \
            -storetype JKS -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 2 -dname "CN=DsmClient CI"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/dsmclient-ci.jks
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          EOF

      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DsmClient-debug-arm64-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove CI signing files
        if: always()
        shell: bash
        run: rm -f android/key.properties "$RUNNER_TEMP/dsmclient-ci.jks"

  publish:
    name: Publish development APK
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: DsmClient-debug-arm64-${{ github.run_number }}
          path: ${{ runner.temp }}/dsmclient-release

      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/dsmclient-release"
          release_tag="dev-$GITHUB_RUN_NUMBER"
          apk="$release_dir/DsmClient-$release_tag-arm64.apk"
          mv "$release_dir/app-debug.apk" "$apk"
          cat > "$release_dir/notes.md" <<EOF
          DsmClient Android ARM64 开发测试版。

          提交：$GITHUB_SHA
          构建记录：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          本 APK 使用临时测试签名。不同构建的签名不同，覆盖安装时可能需要先卸载旧测试版。正式签名和稳定版发布尚未接入。
          EOF
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$apk" --clobber
          else
            gh release create "$release_tag" "$apk" \
              --target "$GITHUB_SHA" \
              --title "DsmClient 开发测试版 $release_tag" \
              --prerelease --notes-file "$release_dir/notes.md"
          fi
