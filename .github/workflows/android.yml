name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ui_preview:
        description: 'Render temporary UI review previews in the build artifact'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11479570'
          packages: 'platform-tools'

      - name: Restore Android platform and build tools
        id: android-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-33
            ${{ env.ANDROID_HOME }}/build-tools/29.0.2
            ${{ env.ANDROID_HOME }}/build-tools/30.0.3
          key: android-${{ runner.os }}-api33-build-tools29.0.2-30.0.3-v1

      - name: Install missing Android packages
        if: steps.android-cache.outputs.cache-hit != 'true'
        run: sdkmanager "platforms;android-33" "build-tools;29.0.2" "build-tools;30.0.3"

      - name: Save Android packages
        if: steps.android-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-33
            ${{ env.ANDROID_HOME }}/build-tools/29.0.2
            ${{ env.ANDROID_HOME }}/build-tools/30.0.3
          key: ${{ steps.android-cache.outputs.cache-primary-key }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.7.12'
          cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Resolve dependencies
        run: flutter pub get

      - name: Test DSM and update protocols
        run: |
          dart --no-sound-null-safety test/dsm_compatibility_test.dart
          dart --no-sound-null-safety test/program_section_test.dart
          dart --no-sound-null-safety test/update_route_test.dart
          dart --no-sound-null-safety test/rr_icons_test.dart
          dart --no-sound-null-safety test/dockhand_client_test.dart
          dart --no-sound-null-safety test/torrent_client_test.dart
          dart --no-sound-null-safety test/torrent_advanced_test.dart
          dart --no-sound-null-safety test/update_release_test.dart
          dart --no-sound-null-safety test/update_download_test.dart

      - name: Test native program navigation
        env:
          DSM_UI_PREVIEW_DIR: ${{ github.event.inputs.ui_preview == 'true' && format('{0}/dsmclient-artifacts', runner.temp) || '' }}
        shell: bash
        run: |
          if [[ -n "$DSM_UI_PREVIEW_DIR" ]]; then
            curl --fail --location --retry 3 --output "$RUNNER_TEMP/dsm-review-font.otf" \
              https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf
          fi
          flutter test --no-sound-null-safety test/native_program_widget_test.dart test/update_workspace_widget_test.dart test/workspace_design_test.dart test/workspace_preview_test.dart test/media_interaction_test.dart test/audio_queue_driver_test.dart test/torrent_workspace_test.dart

      - name: Analyze native program pages
        run: >-
          flutter analyze --no-fatal-infos --no-fatal-warnings
          lib/models/program_section.dart lib/util/program_api.dart
          lib/pages/packages/program_page.dart lib/pages/packages/program_launcher.dart
          lib/pages/packages/audio_station.dart lib/pages/packages/drive.dart
          lib/pages/dashborad/applications.dart
          lib/pages/packages/torrent_program.dart lib/util/torrent_client.dart
          lib/pages/packages/torrent_detail.dart lib/models/torrent_presentation.dart lib/util/service_credentials.dart
          lib/pages/packages/torrent_import.dart lib/pages/home.dart
          lib/pages/packages/snapshots.dart
          lib/pages/setting/about.dart lib/pages/setting/license.dart lib/pages/setting/privacy.dart
          lib/pages/dashborad/shortcut_list.dart lib/pages/packages/package_shortcut.dart
          lib/models/program_capabilities.dart lib/util/update_route.dart lib/pages/update/update.dart
          lib/models/rr_protocol.dart lib/models/dsm_icons.dart lib/models/docker_connection.dart
          lib/util/rr_api.dart lib/util/dockhand_client.dart lib/widgets/nas_app_icon.dart
          lib/pages/packages/rr_program.dart lib/pages/docker/workspace.dart lib/pages/docker/dockhand.dart
          lib/themes/app_theme.dart lib/themes/light.dart lib/themes/dark.dart
          lib/widgets/workspace.dart lib/util/dockhand_credentials.dart lib/pages/common/audio_player.dart
          lib/widgets/surfaces.dart lib/widgets/label.dart lib/pages/control_panel/control_panel.dart
          lib/pages/login/login.dart
          lib/widgets/adaptive_tab_bar.dart lib/widgets/media_actions.dart lib/models/media_queue.dart
          lib/util/media_delete.dart lib/providers/audio_player_provider.dart lib/pages/common/video_player.dart

      - name: Prepare signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            export ANDROID_KEYSTORE_PASSWORD=android
            export ANDROID_KEY_PASSWORD=android
            export ANDROID_KEY_ALIAS=androiddebugkey
            keytool -genkeypair -noprompt \
              -keystore "$RUNNER_TEMP/dsmclient.jks" \
              -storetype JKS -storepass:env ANDROID_KEYSTORE_PASSWORD \
              -keypass:env ANDROID_KEY_PASSWORD \
              -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 2 -dname 'CN=DsmClient CI'
          else
            test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD"
            test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dsmclient.jks"
            keytool -list -keystore "$RUNNER_TEMP/dsmclient.jks" \
              -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null
          fi
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/dsmclient.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          EOF

      - name: Build APK and update manifest
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || 'android' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || 'androiddebugkey' }}
        shell: bash
        run: |
          export DSM_BUILD_NUMBER=$((10000 + GITHUB_RUN_NUMBER))
          build_mode=release
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then build_mode=debug; fi
          flutter build apk "--$build_mode" --no-sound-null-safety \
            --target-platform android-arm64 --build-number "$DSM_BUILD_NUMBER"
          mkdir -p "$RUNNER_TEMP/dsmclient-artifacts"
          signer="$ANDROID_HOME/build-tools/30.0.3/apksigner"
          "$signer" sign --ks "$RUNNER_TEMP/dsmclient.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$RUNNER_TEMP/dsmclient-artifacts/DsmClient-dev-$GITHUB_RUN_NUMBER-arm64.apk" \
            "build/app/outputs/flutter-apk/app-$build_mode.apk"
          "$signer" verify --verbose --print-certs \
            "$RUNNER_TEMP/dsmclient-artifacts/DsmClient-dev-$GITHUB_RUN_NUMBER-arm64.apk"
          # META-INF/services must remain for Kotlin runtime service loading.
          # v2/v3 cover these entries; apply strict warnings on Android 7+ verification.
          "$signer" verify --verbose --min-sdk-version 24 --Werr \
            "$RUNNER_TEMP/dsmclient-artifacts/DsmClient-dev-$GITHUB_RUN_NUMBER-arm64.apk"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'dsmclient-artifacts'
          apk = root / ('DsmClient-dev-' + os.environ['GITHUB_RUN_NUMBER'] + '-arm64.apk')
          badging = subprocess.check_output([os.environ['ANDROID_HOME'] + '/build-tools/30.0.3/aapt', 'dump', 'badging', str(apk)], text=True)
          actual_id = re.search(r"^package: name='([^']+)'", badging, re.M).group(1)
          assert actual_id == 'io.github.user318182456.dsmclient', 'Unexpected APK applicationId'
          if os.environ['GITHUB_EVENT_NAME'] != 'pull_request':
              assert 'application-debuggable' not in badging, 'Release APK must not be debuggable'
          digest = hashlib.sha256()
          with apk.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  digest.update(chunk)
          version = re.search(r'^version:\s*([^+\s]+)', pathlib.Path('pubspec.yaml').read_text(), re.M).group(1)
          manifest = {'packageId': 'io.github.user318182456.dsmclient', 'abi': 'arm64-v8a',
                      'version': version, 'buildNumber': int(os.environ['DSM_BUILD_NUMBER']),
                      'apkName': apk.name, 'size': apk.stat().st_size, 'sha256': digest.hexdigest()}
          (root / 'update-arm64.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY

      - name: Upload APK and update manifest
        uses: actions/upload-artifact@v4
        with:
          name: DsmClient-arm64-${{ github.run_number }}
          path: ${{ runner.temp }}/dsmclient-artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing files
        if: always()
        shell: bash
        run: rm -f android/key.properties "$RUNNER_TEMP/dsmclient.jks"

  publish:
    name: Publish development APK
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: DsmClient-arm64-${{ github.run_number }}
          path: ${{ runner.temp }}/dsmclient-release

      - name: Publish signed development prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          release_dir="$RUNNER_TEMP/dsmclient-release"
          release_tag="dev-$GITHUB_RUN_NUMBER"
          cat > "$release_dir/notes.md" <<EOF
          DsmClient Android ARM64 开发测试版。

          提交：$GITHUB_SHA
          构建记录：https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          本版本使用 DsmClient 独立包名 io.github.user318182456.dsmclient 和固定签名。原版 DSM Helper 或 dev-28 及更早版本用户需首次手动安装为新应用并重新配置账号，数据不会自动迁移。后续同包名版本支持应用内检查、断点下载、SHA-256 校验及覆盖安装，安装仍需在 Android 系统界面确认。
          EOF
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "$release_dir"/*.apk "$release_dir/update-arm64.json" --clobber
          else
            gh release create "$release_tag" "$release_dir"/*.apk "$release_dir/update-arm64.json" \
              --target "$GITHUB_SHA" --title "DsmClient 开发测试版 $release_tag" \
              --draft --prerelease --notes-file "$release_dir/notes.md"
          fi
          gh release edit "$release_tag" --draft=false --prerelease --notes-file "$release_dir/notes.md"
